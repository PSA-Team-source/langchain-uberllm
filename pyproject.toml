[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-uberllm"
version = "0.1.0"
description = "LangChain integration for UberLLM: one OpenAI-compatible API key for hundreds of chat models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AL Global LLC", email = "support@uberllm.dev" }]
requires-python = ">=3.10"
keywords = ["uberllm", "langchain", "llm", "openai-compatible", "ai-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "httpx>=0.25",
]

[project.urls]
Homepage = "https://uberllm.dev"
Documentation = "https://uberllm.dev/docs/langchain"
Models = "https://uberllm.dev/models"
Source = "https://github.com/PSA-Team-source/langchain-uberllm"
Issues = "https://github.com/PSA-Team-source/langchain-uberllm/issues"

[dependency-groups]
test = [
    "pytest>=8",
    "langchain-tests>=1.0.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_uberllm"]

[tool.hatch.build.targets.sdist]
include = ["langchain_uberllm", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
